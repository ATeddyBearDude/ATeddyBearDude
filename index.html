<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olympiad Atlas — a star map of STEM competitions</title>
</head>
<body>
<!-- ATLAS:BEGIN -->
<style>
  :root{
    --ink:#e9edfb;
    --ink-dim:#93a0c4;
    --ink-faint:#5b6788;
    --glass:rgba(255,255,255,.055);
    --glass-strong:rgba(255,255,255,.09);
    --glass-edge:rgba(255,255,255,.16);
    --glass-edge-hi:rgba(255,255,255,.38);
    --ground:#05070f;
    --disp:"Avenir Next",Avenir,Futura,"Century Gothic","Trebuchet MS",ui-sans-serif,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",ui-sans-serif,sans-serif;
    --mono:"SF Mono",ui-monospace,"Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
    --c-math:#7fa3ff; --c-phys:#b79cff; --c-astro:#e8c46a;
    --c-chem:#5fc9a5; --c-bio:#84c96b;  --c-inf:#ff9d6b;
    --c-earth:#c8a06e;--c-multi:#d78fd0;--c-res:#ef8aa2;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--body); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- sky ---------- */
  #sky{position:fixed; inset:0; z-index:0;}
  .nebula{position:fixed; z-index:0; border-radius:50%; filter:blur(90px); pointer-events:none; will-change:transform;}
  #neb1{width:70vmax;height:52vmax;left:-18vmax;top:-16vmax;
        background:radial-gradient(closest-side,rgba(38,54,138,.72),transparent 70%);}
  #neb2{width:64vmax;height:60vmax;right:-22vmax;top:6vmax;
        background:radial-gradient(closest-side,rgba(104,64,166,.58),transparent 70%);}
  #neb3{width:58vmax;height:44vmax;left:14vmax;bottom:-24vmax;
        background:radial-gradient(closest-side,rgba(24,108,108,.52),transparent 70%);}
  #neb4{width:34vmax;height:30vmax;right:8vmax;bottom:-10vmax;
        background:radial-gradient(closest-side,rgba(158,84,52,.32),transparent 70%);}
  #milkyway{
    position:fixed; z-index:0; left:50%; top:50%; width:230vmax; height:52vmax;
    pointer-events:none; will-change:transform; filter:blur(16px);
    background:linear-gradient(180deg,
      transparent 0%, rgba(186,201,244,.030) 26%, rgba(205,217,250,.055) 42%,
      rgba(234,240,255,.085) 50%, rgba(205,217,250,.055) 58%,
      rgba(186,201,244,.030) 74%, transparent 100%);
  }
  /* ---------- world ---------- */
  #viewport{position:fixed; inset:0; z-index:1; overflow:hidden; cursor:grab; touch-action:none;}
  #viewport.dragging{cursor:grabbing;}
  #world{position:absolute; left:50%; top:50%; width:0; height:0;
         transform-origin:0 0; will-change:transform;}
  #lines{position:absolute; left:-3000px; top:-2600px; width:6000px; height:5200px;
         overflow:visible; pointer-events:none;}
  #lines line{stroke:rgba(255,255,255,.10); stroke-width:1; stroke-dasharray:2 7; vector-effect:non-scaling-stroke;}
  .cluster-label{
    position:absolute; transform:translate(-50%,-50%); pointer-events:none;
    font-family:var(--disp); text-transform:uppercase; white-space:nowrap;
    letter-spacing:.55em; text-indent:.55em; font-size:15px; font-weight:600;
    color:rgba(238,242,255,.52); text-align:center;
    text-shadow:0 0 18px rgba(160,178,235,.35);
  }
  .cluster-label small{
    display:block; margin-top:8px; letter-spacing:.28em; text-indent:.28em;
    font-family:var(--mono); font-size:9.5px; font-weight:400;
    color:rgba(168,181,216,.62); text-transform:none; text-shadow:none;
  }
  /* ---------- cards ---------- */
  .card{
    position:absolute; transform:translate(-50%,-50%); touch-action:none;
    width:212px; padding:15px 17px 14px; text-align:left;
    border-radius:18px; border:1px solid var(--glass-edge);
    background:
      radial-gradient(140px 90px at var(--mx,80%) var(--my,-20%), rgba(255,255,255,.13), transparent 60%),
      linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 42%, rgba(255,255,255,.06)),
      var(--glass);
    -webkit-backdrop-filter:blur(14px) saturate(1.35);
    backdrop-filter:blur(14px) saturate(1.35);
    box-shadow:
      inset 0 1px 0 var(--glass-edge-hi),
      inset 0 -1px 0 rgba(255,255,255,.06),
      0 14px 34px rgba(2,4,12,.45);
    color:var(--ink); font-family:var(--body); cursor:pointer;
    transition:transform .28s cubic-bezier(.2,.9,.25,1.2), box-shadow .28s ease, border-color .28s ease;
    opacity:0;
  }
  .card.landed{opacity:1;}
  .card:hover, .card:focus-visible{
    transform:translate(-50%,-50%) translateY(-4px) scale(1.03);
    border-color:var(--glass-edge-hi);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.5),
      inset 0 -1px 0 rgba(255,255,255,.08),
      0 22px 48px rgba(2,4,12,.55),
      0 0 0 1px rgba(255,255,255,.05),
      0 0 26px -6px var(--acc);
    z-index:5;
  }
  .card:focus-visible{outline:2px solid var(--acc); outline-offset:3px;}
  .card .eyebrow{
    display:flex; align-items:center; gap:7px;
    font-family:var(--mono); font-size:9px; letter-spacing:.22em;
    text-transform:uppercase;
    color:color-mix(in srgb, var(--acc) 42%, #d5ddf5);
  }
  .star{
    width:11px;height:11px;flex:none;background:var(--acc);
    clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%);
    filter:drop-shadow(0 0 4px var(--acc)) drop-shadow(0 0 9px color-mix(in srgb, var(--acc) 55%, transparent));
    animation:starPulse 2.8s ease-in-out infinite;
  }
  @keyframes starPulse{
    0%,100%{transform:scale(1); opacity:.92;}
    50%{transform:scale(1.28); opacity:1;}
  }
  .card.noarchive .star{
    width:9px;height:9px;background:transparent;clip-path:none;
    border:1.5px solid var(--acc); border-radius:50%; box-sizing:border-box;
    filter:drop-shadow(0 0 3px var(--acc)); animation:none; opacity:.9;
  }
  .card .eyebrow em{
    font-style:normal; font-size:8px; letter-spacing:.18em; padding:2px 6px 1px;
    border:1px solid rgba(255,255,255,.22); border-radius:999px; color:var(--ink-dim);
  }
  .card h3{
    margin:9px 0 3px; font-family:var(--disp); font-weight:600;
    font-size:23px; letter-spacing:.06em; line-height:1.05; color:var(--ink);
  }
  .card p{margin:0; font-size:12px; line-height:1.42; color:var(--ink-dim);}
  /* ---------- chrome (fixed UI) ---------- */
  .glass-panel{
    border:1px solid var(--glass-edge); background:var(--glass-strong);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    backdrop-filter:blur(20px) saturate(1.4);
    box-shadow:inset 0 1px 0 var(--glass-edge-hi), 0 12px 32px rgba(2,4,12,.45);
  }
  #masthead{
    position:fixed; z-index:10; top:18px; left:18px;
    padding:14px 20px 13px; border-radius:20px; max-width:min(430px, calc(100vw - 36px));
  }
  #masthead h1{
    margin:0; font-family:var(--disp); font-weight:600; font-size:19px;
    letter-spacing:.34em; text-indent:.02em; text-transform:uppercase;
  }
  #masthead h1 em{font-style:normal; color:var(--c-astro);}
  #masthead p{
    margin:5px 0 0; font-size:11.5px; color:var(--ink-dim); letter-spacing:.02em;
  }
  #hint{
    position:fixed; z-index:10; top:22px; right:18px;
    padding:8px 14px; border-radius:999px;
    font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    color:var(--ink-dim); text-transform:uppercase;
    transition:opacity 1s ease;
  }
  #hint.gone{opacity:0; pointer-events:none;}
  #dock{
    position:fixed; z-index:10; left:50%; bottom:16px; transform:translateX(-50%);
    display:flex; gap:6px; padding:8px; border-radius:999px;
    max-width:calc(100vw - 148px); overflow-x:auto; scrollbar-width:none;
  }
  #dock::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; display:flex; align-items:center; gap:7px;
    padding:8px 13px; border-radius:999px; border:1px solid transparent;
    background:transparent; color:var(--ink-dim); cursor:pointer;
    font-family:var(--disp); font-size:11px; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; white-space:nowrap;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .chip .star{width:9px;height:9px;animation-duration:3.4s;}
  .chip:hover{background:rgba(255,255,255,.08); color:var(--ink);}
  .chip.active{background:rgba(255,255,255,.12); color:var(--ink); border-color:var(--glass-edge);}
  .chip:focus-visible{outline:2px solid var(--glass-edge-hi); outline-offset:2px;}
  #controls{
    position:fixed; z-index:10; right:16px; bottom:16px;
    display:flex; flex-direction:column; border-radius:16px; overflow:hidden;
  }
  #controls button{
    width:42px; height:40px; border:0; background:transparent; color:var(--ink);
    font-size:17px; cursor:pointer; font-family:var(--body);
    transition:background .2s ease;
  }
  #controls button + button{border-top:1px solid rgba(255,255,255,.09);}
  #controls button:hover{background:rgba(255,255,255,.1);}
  #controls button:focus-visible{outline:2px solid var(--glass-edge-hi); outline-offset:-3px;}
  /* ---------- modal ---------- */
  #overlay{
    position:fixed; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(3,5,12,.45);
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    opacity:0; transition:opacity .3s ease;
  }
  #overlay.open{display:flex;}
  #overlay.shown{opacity:1;}
  #dossier{
    position:relative; width:min(620px, 100%); max-height:min(78vh, 640px);
    overflow-y:auto; border-radius:26px; padding:30px 34px 28px;
    border:1px solid var(--glass-edge);
    background:
      radial-gradient(420px 240px at 85% -10%, color-mix(in srgb, var(--acc) 16%, transparent), transparent 70%),
      linear-gradient(165deg, rgba(255,255,255,.12), rgba(255,255,255,.03) 45%, rgba(255,255,255,.07)),
      rgba(10,14,28,.72);
    -webkit-backdrop-filter:blur(26px) saturate(1.5);
    backdrop-filter:blur(26px) saturate(1.5);
    box-shadow:inset 0 1px 0 var(--glass-edge-hi), 0 30px 80px rgba(1,2,8,.7);
    transform:translateY(16px) scale(.97);
    transition:transform .34s cubic-bezier(.2,.9,.3,1.15);
  }
  #overlay.shown #dossier{transform:none;}
  #dossier .eyebrow{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    font-family:var(--mono); font-size:10px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--ink-dim);
  }
  #dossier .eyebrow .star{width:12px;height:12px;}
  #dossier .est{
    margin-left:auto; margin-right:42px; padding:4px 10px; border-radius:999px;
    border:1px solid var(--glass-edge); letter-spacing:.18em; color:var(--ink);
  }
  #dossier h2{
    margin:14px 0 2px; font-family:var(--disp); font-weight:600;
    font-size:clamp(26px, 5vw, 34px); letter-spacing:.05em; line-height:1.05;
    text-wrap:balance;
  }
  #dossier .fullname{margin:0 0 18px; font-size:14px; color:var(--ink-dim); letter-spacing:.02em;}
  #dossier h4{
    margin:20px 0 7px; font-family:var(--mono); font-size:10px; font-weight:500;
    letter-spacing:.26em; text-transform:uppercase; color:var(--acc);
  }
  #dossier section p{margin:0; font-size:14px; line-height:1.62; color:var(--ink); max-width:60ch;}
  #dossier .links{display:flex; gap:10px; flex-wrap:wrap; margin-top:24px;}
  #dossier .links a{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 18px; border-radius:999px; text-decoration:none;
    font-family:var(--disp); font-size:12px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase;
    transition:transform .2s ease, background .2s ease, box-shadow .2s ease;
  }
  #dossier .links a.primary{
    color:#0b0e1a; background:linear-gradient(160deg, color-mix(in srgb, var(--acc) 92%, white), var(--acc));
    box-shadow:0 6px 22px -6px var(--acc);
  }
  #dossier .links a.secondary{
    color:var(--ink); border:1px solid var(--glass-edge); background:rgba(255,255,255,.07);
  }
  #dossier .links a:hover{transform:translateY(-2px);}
  #dossier .links a:focus-visible{outline:2px solid var(--glass-edge-hi); outline-offset:3px;}
  #dossier .links a span{font-family:var(--body); font-weight:700;}
  #closeBtn{
    position:absolute; top:16px; right:16px; width:34px; height:34px;
    border-radius:50%; border:1px solid var(--glass-edge);
    background:rgba(255,255,255,.07); color:var(--ink); font-size:15px;
    cursor:pointer; transition:background .2s ease;
  }
  #closeBtn:hover{background:rgba(255,255,255,.16);}
  #closeBtn:focus-visible{outline:2px solid var(--glass-edge-hi); outline-offset:2px;}
  @media (max-width:640px){
    #masthead{padding:11px 15px;}
    #masthead h1{font-size:15px;}
    #masthead p{display:none;}
    #hint{display:none;}
    #dossier{padding:24px 22px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important; animation:none !important;}
  }
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div id="milkyway" aria-hidden="true"></div>
<div class="nebula" id="neb1" aria-hidden="true"></div>
<div class="nebula" id="neb2" aria-hidden="true"></div>
<div class="nebula" id="neb3" aria-hidden="true"></div>
<div class="nebula" id="neb4" aria-hidden="true"></div>

<div id="viewport">
  <div id="world">
    <svg id="lines" viewBox="-3000 -2600 6000 5200" aria-hidden="true"></svg>
  </div>
</div>

<header id="masthead" class="glass-panel">
  <h1>Olympiad <em>Atlas</em></h1>
  <p>A star map of the world's STEM competitions. Drag to roam the sky; every card opens a dossier with history, the official site, and past problems.</p>
</header>

<div id="hint" class="glass-panel">drag to roam · scroll to zoom · click a card</div>

<nav id="dock" class="glass-panel" aria-label="Constellations"></nav>

<div id="controls" class="glass-panel">
  <button id="zin"  title="Zoom in"  aria-label="Zoom in">+</button>
  <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
  <button id="zreset" title="Reset view" aria-label="Reset view">◎</button>
</div>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <article id="dossier">
    <button id="closeBtn" aria-label="Close">✕</button>
    <div class="eyebrow"><i class="star"></i><span id="dCat"></span><span class="est" id="dEst"></span></div>
    <h2 id="dTitle"></h2>
    <p class="fullname" id="dFull"></p>
    <section><h4>What it is</h4><p id="dAbout"></p></section>
    <section><h4>A brief history</h4><p id="dHist"></p></section>
    <div class="links">
      <a class="primary" id="dSite" target="_blank" rel="noopener">Official website <span>↗</span></a>
      <a class="secondary" id="dProbs" target="_blank" rel="noopener"><span>↗</span></a>
    </div>
  </article>
</div>

/* ================= layout ================= */
const positions = {};
(function place(){
  /* cards ring the cluster label — jittered for asymmetry, then relaxed so
     nothing overlaps another card or the label text itself */
  const RINGS = [{cap:6, r:265}, {cap:10, r:465}, {cap:14, r:665}];
  const KX = 1.32, KY = 0.85;              /* elliptical spread */
  const CW = 234, CH = 152;                /* card separation box */
  const byCat = {};
  COMPS.forEach(c => (byCat[c.cat] ??= []).push(c));
  for (const [cat, list] of Object.entries(byCat)){
    const C = CATS[cat];
    const seed = [...cat].reduce((a,ch)=>a+ch.charCodeAt(0), 0);
    let idx = 0;
    for (let ring = 0; idx < list.length; ring++){
      const spec = RINGS[Math.min(ring, RINGS.length-1)];
      const inRing = Math.min(spec.cap, list.length - idx);
      for (let k = 0; k < inRing; k++, idx++){
        const c = list[idx];
        const a = seed + ring*0.9 + k*(Math.PI*2/inRing)
                + 0.30*Math.sin(seed*2.7 + idx*9.13);
        const r = spec.r + 55*Math.sin(seed*1.9 + idx*6.31);
        positions[c.id] = { x: C.x + Math.cos(a)*r*KX, y: C.y + Math.sin(a)*r*KY };
      }
    }
    /* relax: separate card pairs, keep clear of the label rectangle */
    const pts = list.map(c => positions[c.id]);
    const labelHW = C.name.replace("­","").length*7.6 + 130, labelHH = 140;
    for (let it = 0; it < 120; it++){
      let moved = false;
      for (let i = 0; i < pts.length; i++){
        for (let j = i+1; j < pts.length; j++){
          const dx = pts[j].x - pts[i].x, dy = pts[j].y - pts[i].y;
          const ox = CW - Math.abs(dx), oy = CH - Math.abs(dy);
          if (ox > 0 && oy > 0){
            moved = true;
            if (ox/CW < oy/CH){
              const push = (ox/2 + 1) * (dx >= 0 ? 1 : -1);
              pts[i].x -= push; pts[j].x += push;
            } else {
              const push = (oy/2 + 1) * (dy >= 0 ? 1 : -1);
              pts[i].y -= push; pts[j].y += push;
            }
          }
        }
        const ldx = pts[i].x - C.x, ldy = pts[i].y - C.y;
        const lox = labelHW - Math.abs(ldx), loy = labelHH - Math.abs(ldy);
        if (lox > 0 && loy > 0){
          moved = true;
          if (loy < lox*0.5) pts[i].y += (loy + 1) * (ldy >= 0 ? 1 : -1);
          else               pts[i].x += (lox + 1) * (ldx >= 0 ? 1 : -1);
        }
      }
      if (!moved) break;
    }
  }
})();

/* constellation lines: chain cards within each cluster */
(function drawLines(){
  const byCat = {};
  COMPS.forEach(c => (byCat[c.cat] ??= []).push(positions[c.id]));
  let svg = "";
  for (const pts of Object.values(byCat)){
    for (let i=1;i<pts.length;i++){
      svg += `<line x1="${pts[i-1].x}" y1="${pts[i-1].y}" x2="${pts[i].x}" y2="${pts[i].y}"/>`;

/* ================= pan / zoom ================= */
const vp = document.getElementById("viewport");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const HOME = {x:35, y:0, s: innerWidth < 700 ? 0.34 : 0.58};
let cam = {...HOME};             /* world coords at screen center + scale */
let vel = {x:0, y:0};
let flying = null;

function apply(){
  world.style.transform = `scale(${cam.s}) translate(${-cam.x}px, ${-cam.y}px)`;
  const px = -cam.x*cam.s, py = -cam.y*cam.s;
  document.getElementById("neb1").style.transform = `translate(${px*0.018}px, ${py*0.018}px)`;
  document.getElementById("neb2").style.transform = `translate(${px*0.028}px, ${py*0.028}px)`;
  document.getElementById("neb3").style.transform = `translate(${px*0.022}px, ${py*0.022}px)`;
  document.getElementById("neb4").style.transform = `translate(${px*0.034}px, ${py*0.034}px)`;
  document.getElementById("milkyway").style.transform =
    `translate(calc(-50% + ${px*0.012}px), calc(-50% + ${py*0.012}px)) rotate(-19deg)`;
}
function clampCam(){
  cam.x = Math.max(-2600, Math.min(2600, cam.x));
  cam.y = Math.max(-2300, Math.min(2300, cam.y));
  cam.s = Math.max(0.28, Math.min(1.7, cam.s));
}

let drag = null, pinch = null;
const touches = new Map();   /* active pointers, for pinch-to-zoom */

function pinchState(){
  const [a, b] = [...touches.values()];
  return {
    d: Math.max(24, Math.hypot(b.x-a.x, b.y-a.y)),
    mx: (a.x+b.x)/2, my: (a.y+b.y)/2
  };
}
vp.addEventListener("pointerdown", e=>{
  touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (!e.target.closest(".card")) vp.setPointerCapture(e.pointerId);
  if (touches.size === 2){          /* second finger: switch to pinch */
    flying = null; drag = null; vel = {x:0,y:0};
    pinch = pinchState();
    vp.classList.add("dragging");
    dismissHint();
    return;
  }
  if (touches.size > 2 || e.target.closest(".card")) return;
  flying = null;
  drag = {px:e.clientX, py:e.clientY, moved:false, t:performance.now()};
  vel = {x:0,y:0};
  vp.classList.add("dragging");
});
vp.addEventListener("pointermove", e=>{
  if (touches.has(e.pointerId)) touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && touches.size === 2){
    const n = pinchState();
    zoomAt(n.mx, n.my, cam.s * n.d/pinch.d);
    cam.x -= (n.mx - pinch.mx)/cam.s;
    cam.y -= (n.my - pinch.my)/cam.s;
    clampCam(); apply();
    pinch = n;
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.px, dy = e.clientY - drag.py;
  if (Math.abs(dx)+Math.abs(dy) > 3) { drag.moved = true; dismissHint(); }
  const now = performance.now(), dt = Math.max(1, now - drag.t);
  vel = {x: dx/dt*16, y: dy/dt*16};
  drag.px = e.clientX; drag.py = e.clientY; drag.t = now;
  cam.x -= dx/cam.s; cam.y -= dy/cam.s;
  clampCam(); apply();
});
function endDrag(e){
  if (e) touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
  if (touches.size === 1){          /* pinch → one finger left: resume panning */
    const [p] = [...touches.values()];
    drag = {px:p.x, py:p.y, moved:true, t:performance.now()};
    return;
  }
  if (touches.size > 0) return;
  const wasDragging = drag;
  drag = null;
  vp.classList.remove("dragging");
  if (wasDragging && !REDUCED) inertia();
}
vp.addEventListener("pointerup", endDrag);
vp.addEventListener("pointercancel", endDrag);

function inertia(){
  if (drag || flying) return;
  vel.x *= 0.92; vel.y *= 0.92;
  if (Math.hypot(vel.x, vel.y) < 0.3) return;
  cam.x -= vel.x/cam.s; cam.y -= vel.y/cam.s;
  clampCam(); apply();
  requestAnimationFrame(inertia);
}

vp.addEventListener("wheel", e=>{
  e.preventDefault(); dismissHint();
  const k = Math.exp(-e.deltaY * 0.0016);
  zoomAt(e.clientX, e.clientY, cam.s * k);
}, {passive:false});

function zoomAt(sx, sy, ns){
  ns = Math.max(0.28, Math.min(1.7, ns));
  /* keep the world point under (sx,sy) fixed */
  const cx = innerWidth/2, cy = innerHeight/2;
  const wx = cam.x + (sx-cx)/cam.s, wy = cam.y + (sy-cy)/cam.s;
  cam.s = ns;
  cam.x = wx - (sx-cx)/cam.s;
  cam.y = wy - (sy-cy)/cam.s;
  clampCam(); apply();
}

function flyTo(x, y, s, ms=950){
  const from = {...cam}, t0 = performance.now();
  if (REDUCED){ cam = {x,y,s}; clampCam(); apply(); return; }
  const token = flying = {};
  (function step(){
    if (flying !== token) return;
    const t = Math.min(1, (performance.now()-t0)/ms);
    const e = t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
    cam.x = from.x + (x-from.x)*e;
    cam.y = from.y + (y-from.y)*e;
    cam.s = from.s + (s-from.s)*e;
    apply();
    if (t<1) requestAnimationFrame(step); else flying = null;
  })();
}

document.getElementById("zin").onclick  = ()=> zoomAt(innerWidth/2, innerHeight/2, cam.s*1.25);
document.getElementById("zout").onclick = ()=> zoomAt(innerWidth/2, innerHeight/2, cam.s/1.25);
document.getElementById("zreset").onclick = ()=>{
  /* home = the physics constellation at the map's origin */
  setActiveChip(dock.querySelector(".chip"));
  flyTo(CATS.phys.x, CATS.phys.y, 0.62);
};

addEventListener("keydown", e=>{
  if (overlay.classList.contains("open")){
    if (e.key === "Escape") closeDossier();
    return;
  }
  const step = 90/cam.s;
  if (e.key==="ArrowLeft"){cam.x-=step;} else if (e.key==="ArrowRight"){cam.x+=step;}
  else if (e.key==="ArrowUp"){cam.y-=step;} else if (e.key==="ArrowDown"){cam.y+=step;}
  else if (e.key==="+"||e.key==="="){zoomAt(innerWidth/2,innerHeight/2,cam.s*1.15); return;}
  else if (e.key==="-"){zoomAt(innerWidth/2,innerHeight/2,cam.s/1.15); return;}
  else return;
  clampCam(); apply();
});
addEventListener("resize", apply);

/* ================= dock ================= */
const dock = document.getElementById("dock");
let activeChip = null;
for (const [cat, C] of Object.entries(CATS)){
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button";
  b.style.setProperty("--acc", C.color);
  b.innerHTML = `<i class="star"></i>${C.name.replace("­","")}`;
  b.onclick = ()=>{ setActiveChip(b); dismissHint(); flyTo(C.x, C.y, 0.78); };
  dock.appendChild(b);
}
function setActiveChip(b){
  activeChip?.classList.remove("active");
  activeChip = b; b?.classList.add("active");
}

/* ================= dossier modal ================= */
const overlay = document.getElementById("overlay");
let lastFocus = null;
function openDossier(id){
  const c = COMPS.find(x=>x.id===id), C = CATS[c.cat];
  lastFocus = document.activeElement;
  document.getElementById("dossier").style.setProperty("--acc", C.color);
  document.getElementById("dCat").textContent =
    C.name.replace("­","") + (c.univ ? " · university level" : "");
  document.getElementById("dEst").textContent = "est. " + c.est;
  document.getElementById("dTitle").textContent = c.acr;
  document.getElementById("dFull").textContent = c.name;
  document.getElementById("dAbout").textContent = c.about;
  document.getElementById("dHist").textContent = c.hist;
  document.getElementById("dSite").href = c.site;
  const p = document.getElementById("dProbs");
  if (c.probs){
    p.style.display = "";
    p.href = c.probs;
    p.innerHTML = `${c.probsLabel || "Past problems"} <span>↗</span>`;
  } else {
    p.style.display = "none";
  }
  overlay.classList.add("open");
  requestAnimationFrame(()=> overlay.classList.add("shown"));
  document.getElementById("closeBtn").focus();
}
function closeDossier(){
  overlay.classList.remove("shown");
  setTimeout(()=> overlay.classList.remove("open"), REDUCED ? 0 : 280);
  lastFocus?.focus();
}
document.getElementById("closeBtn").onclick = closeDossier;
overlay.addEventListener("click", e=>{ if (e.target === overlay) closeDossier(); });

/* ================= hint ================= */
let hintGone = false;
function dismissHint(){
  if (hintGone) return; hintGone = true;
  document.getElementById("hint").classList.add("gone");
}
setTimeout(dismissHint, 9000);

/* ================= starfield ================= */
const sky = document.getElementById("sky");
const ctx = sky.getContext("2d");
/* three depth layers: parallax factor, twinkle amplitude, size, palette */
const LAYERS = [
  {p:0.014, frac:0.52, rmin:0.25, rmax:0.8,  base:0.5,  amp:0.18, cols:["#8fa0c8","#b9c6e8","#a8b8e0"]},
  {p:0.05,  frac:0.33, rmin:0.55, rmax:1.35, base:0.72, amp:0.30, cols:["#dfe6ff","#f2ead2","#cfdcff"]},
  {p:0.125, frac:0.15, rmin:1.05, rmax:2.3,  base:0.92, amp:0.38, cols:["#ffffff","#ffe9c4","#cfe0ff","#ffd9d0"]}
];
let stars = [];
function seedStars(){
  sky.width = innerWidth * devicePixelRatio;
  sky.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const n = Math.round(innerWidth*innerHeight/4300);
  stars = Array.from({length:n}, ()=>{
    const roll = Math.random();
    const L = LAYERS[roll < LAYERS[0].frac ? 0 : roll < LAYERS[0].frac+LAYERS[1].frac ? 1 : 2];
    const r = L.rmin + Math.random()*(L.rmax - L.rmin);
    return {
      x:Math.random()*innerWidth*1.4 - innerWidth*0.2,
      y:Math.random()*innerHeight*1.4 - innerHeight*0.2,
      r, L,
      col:L.cols[Math.random()*L.cols.length | 0],
      flare:L.p > 0.1 && r > 1.7,           /* brightest foreground stars get a cross flare */
      tw:Math.random()*Math.PI*2,
      ts:0.4+Math.random()*1.4
    };
  });
}
seedStars();
addEventListener("resize", seedStars);

/* soft-glow star sprites: white-hot core, colored halo, gaussian-ish falloff */
function hexA(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
const spriteCache = new Map();
function starSprite(col){
  let c = spriteCache.get(col);
  if (c) return c;
  c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(32,32,0, 32,32,32);
  grad.addColorStop(0,    "rgba(255,255,255,1)");
  grad.addColorStop(0.07, hexA(col, .95));
  grad.addColorStop(0.16, hexA(col, .42));
  grad.addColorStop(0.34, hexA(col, .13));
  grad.addColorStop(0.65, hexA(col, .035));
  grad.addColorStop(1,    hexA(col, 0));
  g.fillStyle = grad;
  g.fillRect(0,0,64,64);
  spriteCache.set(col, c);
  return c;
}

let meteor = null, nextMeteor = performance.now() + 4500;
function drawSky(now){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const ox = -cam.x*cam.s, oy = -cam.y*cam.s;
  /* zooming in slightly grows foreground stars — depth follows the camera */
  const zk = 0.72 + 0.5*Math.min(1.3, cam.s);
  for (const st of stars){
    const L = st.L;
    const a = REDUCED ? L.base : L.base + L.amp*Math.sin(st.tw + now/1000*st.ts);
    ctx.globalAlpha = Math.max(0.08, a);
    let x = (st.x + ox*L.p) % (innerWidth*1.4), y = (st.y + oy*L.p) % (innerHeight*1.4);
    if (x < -innerWidth*0.2) x += innerWidth*1.4;
    if (y < -innerHeight*0.2) y += innerHeight*1.4;
    const r = L.p > 0.1 ? st.r*zk : st.r;
    const halo = r * (L.p > 0.1 ? 11 : L.p > 0.03 ? 8.5 : 7);
    ctx.drawImage(starSprite(st.col), x - halo/2, y - halo/2, halo, halo);
    if (st.flare){
      const f = r*5.2, aa = Math.max(0.04, a*0.5);
      const gh = ctx.createLinearGradient(x-f, y, x+f, y);
      gh.addColorStop(0, hexA(st.col, 0));
      gh.addColorStop(0.5, hexA(st.col, aa));
      gh.addColorStop(1, hexA(st.col, 0));
      const gv = ctx.createLinearGradient(x, y-f, x, y+f);
      gv.addColorStop(0, hexA(st.col, 0));
      gv.addColorStop(0.5, hexA(st.col, aa));
      gv.addColorStop(1, hexA(st.col, 0));
      ctx.globalAlpha = 1; ctx.lineWidth = 0.8;
      ctx.strokeStyle = gh;
      ctx.beginPath(); ctx.moveTo(x-f, y); ctx.lineTo(x+f, y); ctx.stroke();
      ctx.strokeStyle = gv;
      ctx.beginPath(); ctx.moveTo(x, y-f); ctx.lineTo(x, y+f); ctx.stroke();
    }
  }
  /* occasional meteor */
  if (!REDUCED){
    if (!meteor && now > nextMeteor){
      const fromLeft = Math.random()<0.5;
      meteor = {x: fromLeft? -60 : innerWidth+60, y: Math.random()*innerHeight*0.45,
                vx:(fromLeft?1:-1)*(7+Math.random()*5), vy:2.2+Math.random()*2, life:1};
      nextMeteor = now + 6000 + Math.random()*9000;
    }
    if (meteor){
      meteor.x += meteor.vx; meteor.y += meteor.vy; meteor.life -= 0.011;
      const tail = 14;
      const grad = ctx.createLinearGradient(meteor.x, meteor.y,
        meteor.x - meteor.vx*tail, meteor.y - meteor.vy*tail);
      grad.addColorStop(0, `rgba(230,238,255,${0.85*meteor.life})`);
      grad.addColorStop(1, "rgba(230,238,255,0)");
      ctx.strokeStyle = grad; ctx.lineWidth = 1.6; ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(meteor.x, meteor.y);
      ctx.lineTo(meteor.x - meteor.vx*tail, meteor.y - meteor.vy*tail);
      ctx.stroke();
      if (meteor.life <= 0 || meteor.x < -220 || meteor.x > innerWidth+220 || meteor.y > innerHeight+120) meteor = null;
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(drawSky);
}
requestAnimationFrame(drawSky);

/* ================= arrival ================= */
apply();
const cards = [...document.querySelectorAll(".card")];
/* nearest to viewport center land first */
cards
  .map(el=>({el, d: Math.hypot(parseFloat(el.style.left)-HOME.x, parseFloat(el.style.top)-HOME.y)}))
  .sort((a,b)=>a.d-b.d)
  .forEach((c,i)=> setTimeout(()=> c.el.classList.add("landed"), REDUCED ? 0 : 120 + i*36));
if (!REDUCED){
  const s0 = HOME.s*0.86;
  cam.s = s0; apply();
  flyTo(HOME.x, HOME.y, HOME.s, 1400);
}
</script>
